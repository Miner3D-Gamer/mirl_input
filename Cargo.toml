[package]
name = "mirl_input"
version = "0.0.0-alpha"
edition = "2024"
repository = "https://github.com/Miner3D-Gamer/mirl_input"
license.workspace = true
authors.workspace = true
rust-version.workspace = true
maintenance.workspace = true
# # GLFW
# glfw = { version = "0.51.0", optional = true }

# gl = { version = "0.14.0", optional = true }

[features]
default = ["std"]
std = []
all = [
    "std",
    "cursor_loading",
    "all_codecs",
    "all_enum_extensions",
    "mirl_buffer/all",
    "mirl_graphics/all",
]
_checking = ["all", "cursor_show_hotspot"]
# Compatibility with ffi
c_compatible = ["mirl_buffer/c_compatible", "mirl_graphics/c_compatible"]
# Enables all codecs
all_codecs = [
    "serde",
    "bitcode",
    "wincode",
    "compactly",
    "zerocopy",
    "mirl_buffer/all_codecs",
    "mirl_graphics/all_codecs",
]
all_misc_integrations = ["rkyv", "get_size2", "bevy_reflect"]
# # All enum extensions
all_enum_extensions = ["strum", "enum_ext", "enum_ordinalize"]
# Codec stuff
serde = [
    "dep:serde",
    "bitcode?/serde",
    "mirl_buffer/serde",
    "mirl_graphics/serde",
]
bitcode = ["dep:bitcode", "mirl_buffer/bitcode", "mirl_graphics/bitcode"]
wincode = ["dep:wincode", "mirl_buffer/wincode", "mirl_graphics/wincode"]
compactly = [
    "dep:compactly",
    "mirl_buffer/compactly",
    "mirl_graphics/compactly",
]
zerocopy = ["dep:zerocopy", "mirl_buffer/zerocopy", "mirl_graphics/zerocopy"]
# Enum extensions
strum = ["dep:strum", "mirl_graphics/strum"]
enum_ext = ["dep:enum_ext", "mirl_graphics/enum_ext"]

enum_ordinalize = ["dep:enum-ordinalize"]
rkyv = ["dep:rkyv"]
parity_scale_codec = ["dep:parity-scale-codec"]
get_size2 = ["dep:get-size2"]
bevy_reflect = ["dep:bevy_reflect"]

cursor_loading = ["dep:sevenz-rust2"]
# glfw = ["dep:glfw", "dep:gl"]
cursor_show_hotspot = []

[dependencies]
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.2", optional = true }
enum_ext = { version = "0.6", optional = true, default-features = false }
# mirl_core = { version = "0.0.0-alpha" }
mirl_buffer = { version = "0.0.0-alpha" }
mirl_macros = { version = "0.0.0-alpha" }
mirl_graphics = { version = "0.0.0-alpha", features = ["svg"] }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
sevenz-rust2 = { version = "0.22", default-features = false, optional = true }
# Enum functionality
strum = { version = "0.28", optional = true, default-features = false, features = [
    "derive",
] }
wincode = { version = "0.6", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }

enum-ordinalize = { version = "4.4.2", optional = true }
rkyv = { version = "0.8", optional = true }
parity-scale-codec = { version = "3.7", optional = true, features = ["derive"] }
get-size2 = { version = "0.11", optional = true, features = ["derive"] }
bevy_reflect = { version = "0.20", optional = true }

[build-dependencies]
mirl_build_tools = { version = "0.0.0-alpha" }

[lints]
workspace = true
